<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Port Clearance</title>
<meta name="description" content="Fill in and print IMO FAL Forms 1-7 and the Maritime Declaration of Health. Works offline.">
<meta name="theme-color" content="#14232d">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}))}</script>
<script src="../assets/stats.js" defer></script>
<script src="../assets/install.js" defer></script>
<script src="../assets/shared.js" defer></script>
<script src="../assets/docread.js" defer></script>
<script src="import.js" defer></script>
<style id="pageStyle"></style>
<style>
:root{
  --bg:#f5f5f7; --side:rgba(236,236,240,.82); --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --fill:rgba(118,118,128,.12); --accent:#0071e3; --accent-ink:#fff; --danger:#d70015; --paperbg:#e3e4e8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --side:rgba(28,28,30,.82); --card:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --line:#38383a;
    --fill:rgba(118,118,128,.24); --accent:#0a84ff; --danger:#ff453a; --paperbg:#101012}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%}
#scrim{display:none}

/* sidebar */
#side{background:var(--side);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding:calc(14px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.brand img{width:34px;height:34px;border-radius:8px}
.brand b{font-size:16px;letter-spacing:-.01em;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:11.5px}
#recBtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-radius:10px;background:var(--card);
  padding:9px 10px;box-shadow:0 0 0 1px var(--line);margin-bottom:10px}
#recBtn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13.5px}
#recBtn small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
#recBtn svg{flex:none;color:var(--muted)}
nav{overflow:auto;flex:1;min-height:0;margin:0 -4px;padding:0 4px}
nav h4{margin:14px 10px 4px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px;min-height:34px}
nav button:hover{background:var(--fill)}
nav button.on{background:var(--accent);color:var(--accent-ink)}
nav button .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button .t{font-size:11px;font-weight:600;border-radius:5px;padding:1px 5px;background:var(--fill);color:var(--muted);min-width:44px;text-align:center}
nav button.on .t{background:rgba(255,255,255,.25);color:#fff}
nav button .b{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav button.on .b{color:rgba(255,255,255,.85)}
nav svg{flex:none;width:18px;height:18px;color:var(--accent)}
nav button.on svg{color:#fff}
.sidefoot{display:flex;gap:6px;padding-top:8px}
.sidefoot button{flex:1;border:0;background:var(--fill);border-radius:8px;padding:7px 4px;font-size:12.5px}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px 16px;
  border-bottom:1px solid var(--line);background:var(--side);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);min-height:56px;flex-wrap:wrap}
#menuBtn{display:none}
#bar h1{font-size:19px;margin:0;letter-spacing:-.015em;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saved{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{border:0;border-radius:980px;padding:7px 15px;background:var(--fill);font-size:14px;font-weight:500;white-space:nowrap;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.red{color:var(--danger)}
.btn:active{opacity:.7}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 14px;font-size:13.5px;font-weight:500;min-height:30px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
#view{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}

/* editors */
.ed{max-width:980px;margin:0 auto;padding:22px 20px calc(60px + env(safe-area-inset-bottom))}
.ed.wide{max-width:none}
.card{background:var(--card);border-radius:14px;padding:16px 18px 18px;margin-bottom:18px;box-shadow:0 0 0 1px var(--line)}
.card h3{margin:0 0 12px;font-size:15px}
.card p.hint{margin:-6px 0 12px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.w2{grid-column:span 2}.fld.full{grid-column:1/-1}
@media (max-width:560px){.fld.w2{grid-column:1/-1}}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.inp{border:0;background:var(--fill);border-radius:8px;padding:8px 10px;width:100%;min-height:36px;outline:none;font-size:15px}
.inp:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
textarea.inp{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q>div:first-child{flex:1;font-size:14px}
.q .inp{max-width:240px}
.tblwrap{overflow:auto;border-radius:10px;box-shadow:0 0 0 1px var(--line);background:var(--card)}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.g td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.g td:last-child,table.g td.num{border-right:0}
table.g td.num{color:var(--muted);font-size:12px;text-align:right;padding:0 6px 0 10px;font-variant-numeric:tabular-nums;width:1%}
table.g tr:last-child td{border-bottom:0}
table.g input{border:0;background:none;width:100%;min-width:var(--mw,90px);padding:8px;outline:none;font-size:14px;min-height:36px}
table.g input:focus{background:color-mix(in srgb,var(--accent) 12%,transparent)}
table.g .del{border:0;background:none;color:var(--muted);width:34px;height:34px;font-size:17px;border-radius:8px}
table.g .del:hover{color:var(--danger);background:var(--fill)}
table.g th.ob,table.g td.ob{width:1%;text-align:center;padding:0 12px;border-right:2px solid var(--line)!important;white-space:nowrap}
table.g td.ob input{width:20px;height:20px;min-width:0;min-height:0;padding:0;accent-color:var(--accent)}
table.g tr.off td:not(.ob):not(:last-child) input,table.g tr.off td.num{opacity:.45}
.gbar{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap;align-items:center}
.gbar .sp{flex:1}
.note{color:var(--muted);font-size:12.5px}

/* paper */
#paperWrap{background:var(--paperbg);min-height:100%;padding:20px 12px 60px}
#paper{margin:0 auto;width:max-content}
.sheet{position:relative;background:#fff;overflow:hidden;margin:0 auto 18px;box-shadow:0 1px 3px rgba(0,0,0,.2),0 8px 30px rgba(0,0,0,.12);color:#000;color-scheme:light}
.page{position:absolute;left:0;top:0;transform-origin:0 0}
.page svg{position:absolute;left:0;top:0;display:block}
.f{position:absolute;display:flex;align-items:flex-start;font:10pt/1.15 Arial,"Liberation Sans",Helvetica,sans-serif;color:#000;white-space:pre-wrap}
.f.c{align-items:center;font-size:9pt;padding:0 2pt}
.f.vc{align-items:center}
.f.ar{text-align:right}.f.ac{text-align:center}
.e{flex:1 1 auto;min-width:0;min-height:1.15em;outline:none;border-radius:1.5pt;position:relative}
.f.multi .e{flex:0 1 auto}
.f.multi .e:last-child{flex:1 1 auto}
.sep{flex:none;white-space:pre}
.sep.off{display:none}
.sig{margin-left:12pt;height:100%;max-height:30pt;flex:none;align-self:center;object-fit:contain}
.dp{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;font-size:16px}
.box{position:absolute;display:flex;align-items:center;justify-content:center;font:bold 13pt/1 Arial,Helvetica,sans-serif;color:#000}
.int .f,.int .mf{cursor:text}
.int .box,.int .yn,.int .ynw{cursor:pointer}
.int .e:not(.ro):hover,.int .box:hover,.int .mf:hover,.int .yn:hover{background:rgba(0,113,227,.09)}
.int .e:focus,.int .mf:focus{background:rgba(0,113,227,.13);box-shadow:0 0 0 .6pt #0071e3}
.int .f.multi .e:empty::before,.int .f.multi .dt:empty::before{content:attr(data-ph);color:#b4b4bd}
.int .f.multi .e{min-width:16pt}
.int .f.multi .e:empty,.int .f.multi .e.d:has(.dt:empty){margin-right:6pt}
/* MDH */
.mrow{position:absolute;display:flex;align-items:baseline;white-space:nowrap;line-height:1;color:#000;font-family:"Times New Roman",Times,"Liberation Serif",serif}
.mrow>i{display:block;flex:none;height:20pt;width:0}
.mrow{pointer-events:none}.mrow>*{pointer-events:auto}
.mp{flex:none;display:block}
.mf{outline:none;position:relative;border-radius:1pt}
.mf:empty::before,.mf .dt:empty::before{content:attr(data-dots)}
.mf.m{white-space:normal;line-height:1.14}
.mf.m:empty{white-space:nowrap;overflow:hidden}
.mf:not(:empty):not(.d),.mf .dt:not(:empty){padding:0 2pt}
.yn.on{text-align:center;font-weight:bold}
.msig{position:absolute;left:10pt;bottom:-2pt;height:20pt}

#printRoot{position:absolute;left:-20000px;top:0;visibility:hidden}
#printRoot .sheet{box-shadow:none;margin:0}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{display:flex;align-items:center;padding:14px 16px 10px 20px;gap:10px}
.dh h2{font-size:17px;margin:0;flex:1}
.db{padding:4px 20px 18px;overflow:auto}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .tt{flex:1;min-width:0}
.li .tt b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tt small{color:var(--muted);font-size:12px}
.li.cur .tt b{color:var(--accent)}
.li button.x{border:0;background:var(--fill);border-radius:980px;padding:5px 11px;font-size:12.5px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.chk:first-child{border-top:0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.chk small{color:var(--muted);margin-left:auto;font-size:12px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;z-index:20;top:0;bottom:0;left:0;width:280px;transform:translateX(-100%);transition:transform .22s ease;background:var(--card)}
  body.menu #side{transform:none;box-shadow:0 0 60px rgba(0,0,0,.35)}
  #scrim{display:none;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.3)}
  body.menu #scrim{display:block}
  #menuBtn{display:inline-flex;padding:7px 10px}
  #saved{display:none}
}
@media print{
  html,body{height:auto;background:#fff}
  #app,dialog{display:none !important}
  #printRoot{position:static;visibility:visible}
  #printRoot .sheet{break-after:page;page-break-after:always;break-inside:avoid}
  #printRoot .sheet:last-child{break-after:auto;page-break-after:auto}
  #printRoot .sheet.land{page:land}
  body.rot #printRoot .sheet.land{page:auto;width:595.27pt !important;height:841.88pt !important}
  body.rot #printRoot .sheet.land>.page{transform:translateX(595.27pt) rotate(90deg)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.shpill{display:block;width:calc(100% - 4px);margin:0 2px 8px;border:0;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:600;text-align:left;background:var(--fill);color:var(--muted)}
.shpill.ok{background:rgba(26,138,60,.16);color:#1a8a3c}.shpill.bad{background:rgba(183,121,31,.2);color:#b7791f}
#doneBtn.on{background:rgba(26,138,60,.16);color:#1a8a3c}
#doneBar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:rgba(26,138,60,.14);color:var(--ink);font-size:14px;border-bottom:1px solid var(--line)}
#doneBar[hidden]{display:none}#doneBar span{flex:1;min-width:200px}
.rq{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.rq input{flex:1;min-width:180px;border:0;background:var(--fill);border-radius:9px;padding:9px 11px;font-size:14px}.rq select{border:0;background:var(--fill);border-radius:9px;padding:9px 10px;font-size:14px}
.rchips{display:flex;gap:6px;margin-bottom:6px}.rchips button{border:0;background:var(--fill);border-radius:980px;padding:5px 13px;font-size:13px;font-weight:500}.rchips button.on{background:var(--accent);color:var(--accent-ink)}
#recList .li{flex-wrap:wrap}#recList .li .tt{flex:1 1 100%}#recList .li .tt b{white-space:normal}.shpill[hidden]{display:none}.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--fill);color:var(--muted)}.badge.done{background:#1a8a3c;color:#fff}
.impdrop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.impdrop.over{border-color:var(--accent);background:var(--fill)}
#impPaste{width:100%;border:0;background:var(--fill);border-radius:9px;padding:9px 11px;font:13px var(--font);resize:vertical;margin-bottom:8px}
.impsec{border-top:1px solid var(--line);padding:12px 0}.impsec label.h{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14.5px;cursor:pointer}
.impsec input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex:none}.impsec .pv{margin:6px 0 0 28px;font-size:12.5px;color:var(--muted);line-height:1.5}
.impsec .opt{margin:8px 0 0 28px;display:flex;gap:14px;flex-wrap:wrap;font-size:13px;align-items:center}.impsec .warn{margin:6px 0 0 28px;font-size:12.5px;color:#b7791f}
.impopts{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:13.5px}.imperr{color:var(--danger);font-size:13px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img src="icon.png" alt=""><div><b>Port Clearance</b><small>FAL 1–7 · Declaration of Health</small></div></div>
    <button id="recBtn" title="Saved clearances"><span id="recTitle"></span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5 7 2.5l3 3M4 8.5l3 3 3-3"/></svg></button>
    <nav id="nav"></nav>
    <button id="shBtn" class="shpill" hidden type="button"></button>
    <div class="sidefoot"><button id="backupBtn">Backup</button><button id="setBtn">Settings</button></div>
  </aside>
  <div id="scrim"></div>
  <main>
    <div id="bar">
      <button class="btn" id="menuBtn" aria-label="Menu">☰</button>
      <h1 id="title"></h1>
      <span id="saved">Saved on this device</span>
      <span id="tools" class="row"></span>
      <button class="btn" id="doneBtn" type="button">Mark as done</button>
      <button class="btn pri" id="printBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.5 6V2h7v4M4.5 11.5H2.5v-5h11v5h-2M4.5 9.5h7V14h-7z"/></svg>Print</button>
    </div>
    <div id="doneBar" hidden><span>✓ This clearance is marked <b>Done</b> and locked, so it is not changed by mistake.</span><button class="btn" data-reopen type="button">Reopen as draft</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="printRoot"></div>
<dialog id="dlg"></dialog>
<input type="file" id="file" hidden>

dlg.addEventListener('change',e=>{if(e.target.id==='recSort'){RQ.sort=e.target.value;drawRecs()}});
function lockUi(){const lk=isDone(REC);[...$('#view').children].forEach(c=>c.inert=lk);$('#tools').inert=lk;$('#doneBar').hidden=!lk;
  const b=$('#doneBtn');b.textContent=lk?'✓ Done':'Mark as done';b.classList.toggle('on',lk);b.title=lk?'Marked as done and locked. Click to reopen it as a draft.':'Mark this clearance as finished'}
function setDone(on){REC.status=on?'done':'';REC.updated=Date.now();save();lockUi();$('#saved').textContent=on?'Marked as done':'Reopened as draft'}
$('#doneBtn').onclick=()=>setDone(!isDone(REC));
$('#doneBar').addEventListener('click',e=>{if(e.target.closest('[data-reopen]'))setDone(false)});
dlg.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.open){save();openRec(d.open);dlg.close();go(cur)}
  else if(d.dup){const r=store.records.find(x=>x.id===d.dup),n={id:uid(),updated:Date.now(),data:JSON.parse(JSON.stringify(r.data))};store.records.push(n);openRec(n.id);save();dlg.close();go(cur)}
  else if(d.rm){const r=store.records.find(x=>x.id===d.rm);if(!confirm('Delete “'+recTitle(r)+'”? This cannot be undone.'))return;
    store.records=store.records.filter(x=>x.id!==d.rm);if(!store.records.length)store.records.push({id:uid(),updated:Date.now(),data:blank()});
    if(REC.id===d.rm){openRec(store.records[0].id);go(cur)}save();drawRecs()}
  else if(d.new){const b=blank();if(d.new==='keep'){const c=x=>JSON.parse(JSON.stringify(x));b.ship=c(D.ship);b.crew=c(D.crew);b.stores=c(D.stores);b.dgx=c(D.dgx);
      if(D.voy.mode==='arrival')Object.assign(b.voy,{mode:'departure',port:D.voy.port,agent:D.voy.agent,lastPort:D.voy.lastPort,nextPort:D.voy.nextPort,voyageNo:D.voy.voyageNo});
      else Object.assign(b.voy,{mode:'arrival',port:D.voy.nextPort,lastPort:D.voy.port,voyageNo:D.voy.voyageNo})}
    const n={id:uid(),updated:Date.now(),data:b};store.records.push(n);openRec(n.id);save();if(d.new==='import'){go('ship');importDlg();return}dlg.close();go(d.new==='keep'?'voyage':'ship')}
  else if(d.exp){download(d.exp==='all'?{app:'port-clearance',version:1,records:store.records,settings:store.settings}:{app:'port-clearance',version:1,records:[REC]},d.exp==='all'?'port-clearance-backup':(recTitle(REC).replace(/[^\w]+/g,'-').replace(/^-|-$/g,'')||'clearance'))}
  else if(d.imp){const f=$('#file');f.accept='.json,application/json';f.onchange=()=>{const fl=f.files[0];if(!fl)return;fl.text().then(t=>{const j=JSON.parse(t);if(!j||!Array.isArray(j.records))throw 0;
      let last;j.records.forEach(r=>{if(!r||!r.data)return;const n={id:uid(),updated:r.updated||Date.now(),data:merge(blank(),r.data)};store.records.push(n);last=n});
      if(j.settings&&j.settings.sig&&!store.settings.sig)store.settings.sig=j.settings.sig;if(last){openRec(last.id);save();dlg.close();go(cur)}}).catch(()=>alert('This file is not a Port Clearance backup.'));f.value=''};f.click()}
  else if(d.sigadd){const f=$('#file');f.accept='image/*';f.onchange=()=>{const fl=f.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const s=Math.min(1,700/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);store.settings.sig=c.toDataURL('image/png');save();settings();render()};im.src=URL.createObjectURL(fl);f.value=''};f.click()}
  else if(d.sigrm){store.settings.sig='';save();settings();render()}
  else if(d.rst){RQ.st=d.rst;drawRecs()}
  else if(d.done){const r=store.records.find(x=>x.id===d.done);if(!r)return;r.status=isDone(r)?'':'done';r.updated=Date.now();save();if(r.id===REC.id)lockUi();drawRecs()}
  else if(d.print){save();openRec(d.print);dlg.close();go('ship');setTimeout(()=>$('#printBtn').click(),80)}
  else if(d.shared){if(window.SeaShared)SeaShared.open()}
  else if(d.impdlg){importDlg()}
  else if(d.impfile){$('#impFile').click()}
  else if(d.impread){readPasted()}
  else if(d.impapply){applyImport()}
  else if(d.doprint){const ids=$$('#dlg input[data-doc]:checked').map(i=>i.dataset.doc);if(!ids.length)return;const rot=$('#rot').checked;dlg.close();doPrint(ids,rot)}});
function download(obj,name){const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#backupBtn').onclick=()=>sheetDlg('Backup',`<p class="note" style="font-size:13.500px;margin:0 0 12px">Everything is saved automatically in this browser on this device. Export a file to keep a copy, or to move your clearances to another computer or iPad.</p>
  <div class="li"><div class="tt"><b>Import from documents</b><small>Fill this clearance from Word, Excel, CSV or PDF files: crew, passengers, stores, cargo, ship, port call</small></div><button class="x" data-impdlg="1">Choose…</button></div>
  <div class="li"><div class="tt"><b>Shared database file</b><small>Keep all clearances in one file on a shared network drive, so other computers use them too</small></div><button class="x" data-shared="1">Set up…</button></div>
  <div class="li"><div class="tt"><b>This clearance</b><small>${esc(recTitle(REC))}</small></div><button class="x" data-exp="one">Export file</button></div>
  <div class="li"><div class="tt"><b>All clearances</b><small>${store.records.length} saved, with settings</small></div><button class="x" data-exp="all">Export file</button></div>
  <div class="li"><div class="tt"><b>Import</b><small>Adds the clearances from a backup file</small></div><button class="x" data-imp="1">Choose file…</button></div>`);
function settings(){const f=store.settings.dateFmt,o=(v,l)=>`<option value="${v}"${f===v?' selected':''}>${l}</option>`;
  sheetDlg('Settings',`<div class="li"><div class="tt"><b>Date format on forms</b><small>How dates are printed</small></div><select class="inp" id="dfmt" style="width:auto">${o('mon','14 Nov 2026')}${o('slash','14/11/2026')}${o('dot','14.11.2026')}${o('iso','2026-11-14')}</select></div>
  <div class="li"><div class="tt"><b>Signature image</b><small>${store.settings.sig?'Printed in the signature box of every form':'Optional – a photo or scan of the master’s signature'}</small></div>${store.settings.sig?`<img src="${store.settings.sig}" alt="" style="height:34px;background:#fff;border-radius:6px;padding:2px"><button class="x" data-sigrm="1">Remove</button>`:`<button class="x" data-sigadd="1">Choose image…</button>`}</div>`);
  $('#dfmt').onchange=e=>{store.settings.dateFmt=e.target.value;save();nav();render()}}
$('#setBtn').onclick=settings;

/* ---------- import from documents ---------- */
const IMP={parts:[],errors:[],F:null,open:false};
const KIND_NAME={crew:'Crew',pax:'Passengers',person:'People (crew or passengers?)',stores:"Ship's stores",cargo:'Cargo',dg:'Dangerous goods'};
function importDlg(){IMP.parts=[];IMP.errors=[];IMP.F=null;IMP.open=true;
  sheetDlg('Import from documents',`<p class="note" style="font-size:13.5px;margin:0 0 6px">Drop Word, Excel, CSV or PDF files here: crew list, passenger list, stores, cargo, an earlier clearance… The program looks for the crew, passengers, stores, cargo, ship and port call and shows what it found before anything is used. Nothing leaves this computer.</p>
    <div class="impdrop" id="impDrop"><b>Drop files here</b><span>or</span><button class="btn" data-impfile="1">Choose files…</button></div>
    <input type="file" id="impFile" multiple hidden accept=".docx,.xlsx,.xlsm,.csv,.tsv,.txt,.pdf">
    <textarea id="impPaste" rows="3" placeholder="…or paste text copied from Word, Excel or a PDF"></textarea>
    <div style="margin-bottom:6px"><button class="btn" data-impread="1">Read the pasted text</button></div>
    <div id="impOut"></div>`,
    `<button class="btn" data-close>Cancel</button><button class="btn pri" data-impapply="1" id="impGo" disabled>Import selected</button>`)}
dlg.addEventListener('close',()=>{IMP.open=false});
dlg.addEventListener('dragover',e=>{if(IMP.open&&$('#impDrop')){e.preventDefault();$('#impDrop').classList.add('over')}});
dlg.addEventListener('dragleave',e=>{const z=$('#impDrop');if(z&&!dlg.contains(e.relatedTarget))z.classList.remove('over')});
dlg.addEventListener('drop',e=>{if(IMP.open&&$('#impDrop')){e.preventDefault();$('#impDrop').classList.remove('over');readFiles(e.dataTransfer.files)}});
dlg.addEventListener('change',e=>{if(e.target.id==='impFile'){readFiles(e.target.files);e.target.value=''}});
async function readFiles(files){files=[...files||[]];if(!files.length)return;
  if(!window.DocRead||!window.PCImport){IMP.errors.push('The reader is not loaded yet, try again in a moment.');renderImp();return}
  $('#impOut').innerHTML='<p class="note">Reading…</p>';
  for(const f of files){try{const text=await DocRead.read(f);IMP.parts.push(PCImport.parse(text,f.name))}catch(err){IMP.errors.push(err.message||String(err))}}
  IMP.F=PCImport.merge(IMP.parts);renderImp()}
function readPasted(){const t=($('#impPaste')||{}).value||'';if(!t.trim())return;IMP.parts.push(PCImport.parse(DocRead.tabs(t),'pasted text'));IMP.F=PCImport.merge(IMP.parts);renderImp()}
function personLine(r){return[[r.family,r.given].filter(Boolean).join(' '),r.rank,r.nat,r.dob&&fmt(r.dob)].filter(Boolean).join(' · ')}
const rowLine={crew:personLine,pax:personLine,person:personLine,stores:r=>[r.article,r.qty].filter(Boolean).join(' · '),cargo:r=>[r.bl,r.desc||r.marks,r.weight].filter(Boolean).join(' · '),dg:r=>[r.un,r.psn,r.cls].filter(Boolean).join(' · ')};
function renderImp(){const F=IMP.F||{ship:{},voy:{},tables:[],sources:[]},out=$('#impOut');if(!out)return;
  const nShip=Object.keys(F.ship).length,nVoy=Object.keys(F.voy).length;let h='';
  if(IMP.errors.length)h+=IMP.errors.map(m=>`<div class="imperr">${esc(m)}</div>`).join('');
  const found=nShip||nVoy||F.tables.length;
  if(!found){h+=IMP.parts.length?'<p class="note" style="margin:10px 0">Nothing recognisable was found. The files need a header row such as <b>Family name · Given names · Rank · Nationality</b> (or <b>Name of article · Quantity</b>), or labelled lines such as <b>Name of ship: …</b>, <b>Port of arrival: …</b>. You can also add more files above.</p>':'';out.innerHTML=h;$('#impGo').disabled=true;return}
  h+=`<div class="impopts"><label><input type="radio" name="impfill" value="fill" checked> Only fill empty fields</label><label><input type="radio" name="impfill" value="over"> Overwrite fields that already have a value</label></div>`;
  const kv=(o,names)=>Object.keys(o).map(k=>`${names[k]||k}: <b>${esc(k==='date'?fmt(o[k]):o[k])}</b>`).join(' · ');
  if(nShip)h+=`<div class="impsec"><label class="h"><input type="checkbox" data-imp="ship" checked><span>Vessel details<div class="pv" style="margin-left:0">${kv(F.ship,{name:'Name',type:'Type',imo:'IMO',callSign:'Call sign',flag:'Flag',master:'Master',gt:'GT',nt:'NT',registry:'Registry'})}</div></span></label></div>`;
  if(nVoy)h+=`<div class="impsec"><label class="h"><input type="checkbox" data-imp="voy" checked><span>Voyage and port call<div class="pv" style="margin-left:0">${kv(F.voy,{mode:'Mode',port:'Port',date:'Date',lastPort:'Last port',nextPort:'Next port',voyageNo:'Voyage no.',agent:'Agent'})}</div></span></label></div>`;
  const seen={};
  F.tables.forEach((t,i)=>{const tk=t.kind==='person'?'crew':t.kind,isFirst=!seen[tk];seen[tk]=1;const first=t.rows.slice(0,4).map(r=>esc((rowLine[t.kind]||rowLine.crew)(r))).join('<br>')+(t.rows.length>4?`<br>… and ${t.rows.length-4} more`:'');
    const isP=t.kind==='crew'||t.kind==='pax'||t.kind==='person',have={crew:D.crew,pax:D.pax,stores:D.stores,cargo:D.cargo,dg:D.dg}[t.kind==='person'?'crew':t.kind],hasRows=have&&count(have)>0;
    h+=`<div class="impsec"><label class="h"><input type="checkbox" data-imp="t${i}" checked><span>${KIND_NAME[t.kind]} – ${t.rows.length} ${isP?'people':'rows'} <small style="font-weight:400;color:var(--muted)">from ${esc(t.from)}</small></span></label>
      <div class="pv">${first}</div>
      <div class="opt">${isP?`<label>These are <select data-kind="${i}"><option value="crew"${t.kind!=='pax'?' selected':''}>crew</option><option value="pax"${t.kind==='pax'?' selected':''}>passengers</option></select></label>`:''}
        <label><input type="radio" name="impmode${i}" value="add" ${hasRows||!isFirst?'checked':''}> Add to the list</label><label><input type="radio" name="impmode${i}" value="replace" ${hasRows||!isFirst?'':'checked'}> Replace the list</label></div>
      ${t.warn.length?`<div class="warn">Check: ${esc(t.warn.join('; '))}</div>`:''}${t.unknown.length?`<div class="pv">Columns not used: ${esc(t.unknown.join(', '))}</div>`:''}</div>`});
  out.innerHTML=h;$('#impGo').disabled=false}
const PERSONKEYS=['family','given','rank','nat','dob','pob','gender','idType','idNo','idState','idExp','effects'],PAXKEYS=['family','given','nat','dob','pob','gender','idType','idNo','idState','idExp','embark','visa','disembark','transit'];
const LISTKEYS={crew:PERSONKEYS,pax:PAXKEYS,stores:['article','qty','loc'],cargo:['bl','marks','desc','weight','meas'],dg:['stow','ref','marks','un','psn','cls','pg','addl','pkgs','mass','ems']};
function applyImport(){const F=IMP.F;if(!F)return;const fill=$('input[name=impfill]:checked',dlg).value==='fill',done=[];
  const set=(obj,src,keys)=>{let n=0;keys.forEach(k=>{if(src[k]!=null&&src[k]!==''&&(!fill||!String(obj[k]||'').trim())){if(obj[k]!==src[k])n++;obj[k]=src[k]}});return n};
  const on=k=>{const c=$(`input[data-imp="${k}"]`,dlg);return c&&c.checked};
  if(on('ship')){const n=set(D.ship,F.ship,Object.keys(F.ship));if(n)done.push('vessel details');}
  if(on('voy')){const v=F.voy,keep=v.mode&&(!fill||!D.voy.port);if(keep)D.voy.mode=v.mode;const n=set(D.voy,v,Object.keys(v).filter(k=>k!=='mode'));if(n||keep)done.push('port call')}
  const replaced={};
  F.tables.forEach((t,i)=>{if(!on('t'+i))return;
    let kind=t.kind;if(kind==='person')kind='crew';const sel=$(`select[data-kind="${i}"]`,dlg);if(sel)kind=sel.value;
    let mode=($(`input[name="impmode${i}"]:checked`,dlg)||{}).value||'add';if(mode==='replace'){if(replaced[kind])mode='add';replaced[kind]=1}
    const keys=LISTKEYS[kind],rows=t.rows.map(r=>{const o={};keys.forEach(k=>{if(r[k]!=null&&r[k]!=='')o[k]=r[k]});return o});
    let added=0,updated=0;
    if(mode==='replace'){D[kind]=rows;added=rows.length}
    else{const list=D[kind].filter(rowUsed),sig=r=>[r.family,r.given,r.dob].map(x=>String(x||'').trim().toLowerCase()).join('|');
      D[kind]=list;
      rows.forEach(r=>{if(kind==='crew'||kind==='pax'){const x=list.find(e=>sig(e)===sig(r));if(x){if(set(x,r,keys))updated++;return}}
        else{const x=list.find(e=>JSON.stringify(keys.map(k=>e[k]||''))===JSON.stringify(keys.map(k=>r[k]||'')));if(x)return}
        list.push(r);added++})}
    done.push(`${KIND_NAME[kind].toLowerCase()}: ${added} added`+(updated?`, ${updated} updated`:''))});
  if(D.crew.length)syncMdh();touch();save();dlg.close();
  const shown=F.tables.some(t=>t.kind==='stores')&&!F.tables.some(t=>/crew|pax|person/.test(t.kind))?'stores':F.tables.length?(F.tables[0].kind==='pax'?'pax':'crew'):'voyage';
  go(['crew','pax','stores','cargo','dg','voyage','ship'].includes(shown)?shown:'crew');const msg=done.length?'Imported – '+done.join('; '):'Nothing was changed';$('#saved').textContent=msg;setTimeout(()=>{$('#saved').textContent=msg},600)}

/* ---------- printing ---------- */
const isSafari=/^((?!chrome|chromium|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
function hasData(id){const t=SPEC[id].table;if(t)return(t.src==='crew'?countOn(D.crew):count(D[t.src]))>0;if(id==='mdh')return D.voy.mode==='arrival';return true}
$('#printBtn').onclick=()=>{const isDoc=!!SPEC[cur];
  sheetDlg('Print',DOCS.map(id=>`<label class="chk"><input type="checkbox" data-doc="${id}"${(isDoc?id===cur:hasData(id))?' checked':''}><span><b>${SPEC[id].no}</b> &nbsp;${esc(SPEC[id].name)}</span><small>${pagesOf(id)} page${pagesOf(id)>1?'s':''} · ${SPEC[id].land?'landscape':'portrait'}</small></label>`).join('')+
   `<label class="chk" style="margin-top:6px"><input type="checkbox" id="rot"${isSafari?' checked':''}><span>Turn landscape forms onto upright A4 sheets</span></label><p class="note" style="margin:6px 0 0">Print on A4 at 100% scale, without headers and footers. Choose “Save as PDF” in the print window to keep a PDF.</p>`,
   `<button class="btn" data-close>Cancel</button><button class="btn pri" data-doprint="1">Print</button>`)};
function doPrint(ids,rot){const root=$('#printRoot');root.innerHTML='';const keep=extraPages;extraPages={};
  ids.forEach(id=>renderDoc(id,false).forEach(s=>root.append(s)));extraPages=keep;fitAll(root);
  const lands=ids.map(id=>!!SPEC[id].land),all=lands.every(Boolean),none=!lands.some(Boolean);
  document.body.classList.toggle('rot',rot&&!none);
  $('#pageStyle').textContent=(rot||none)?'@page{size:A4 portrait;margin:0}':all?'@page{size:A4 landscape;margin:0}':'@page{size:A4 portrait;margin:0}@page land{size:A4 landscape;margin:0}';
  const t=document.title;document.title=(recTitle(REC)+' '+(ids.length===1?SPEC[ids[0]].no:'port clearance')).replace(/[·\/]/g,'-');
  const done=()=>{document.title=t;removeEventListener('afterprint',done)};addEventListener('afterprint',done);
  const go=()=>setTimeout(()=>window.print(),80);
  const imgs=$$('img',root).filter(i=>!i.complete);if(imgs.length)Promise.all(imgs.map(i=>new Promise(r=>{i.onload=i.onerror=r}))).then(go);else go()}
window.__print=doPrint;

nav();render();
</script>
